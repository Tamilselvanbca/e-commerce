# Production stack: MySQL + API + Next.js + Caddy (automatic HTTPS).
#   1. cp backend/.env.example backend/.env.production   (fill in real values)
#   2. Set DOMAIN, MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD in a root .env file (see docs/DEPLOYMENT.md)
#   3. docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ushop -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://shop:${MYSQL_PASSWORD}@mysql:3306/shop
      FRONTEND_URL: https://${DOMAIN:?set DOMAIN}
    volumes:
      - uploads:/app/uploads # used when STORAGE_DRIVER=local
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
    restart: unless-stopped
    environment:
      SITE_URL: https://${DOMAIN}
    depends_on:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  mysqldata:
  uploads:
  caddy_data:
  caddy_config:
